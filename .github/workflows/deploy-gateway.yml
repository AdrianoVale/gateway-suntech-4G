name: Deploy Gateway Sunteh

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gateway-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Validar Implementação (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validar Compilação e Sintaxe
        run: dotnet build -c Release

  deploy:
    name: Deploy via SCP & SSH
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar Binários Otimizados para Linux
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained false -o ./dist

      - name: Transferir arquivos compilados (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: "/tmp/gateway-deploy-${{ github.run_id }}"
          strip_components: 1

      - name: Atualizar e Reiniciar Serviço (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            APP_ROOT="/opt/gateway-sunteh"
            RUN_TMP="/tmp/gateway-deploy-${{ github.run_id }}"
            BACKUPS_DIR="$APP_ROOT/backups"
            DEPLOY_ID="$(date +%Y%m%d%H%M%S)-${{ github.run_number }}"
            BACKUP_FILE="$BACKUPS_DIR/deploy-$DEPLOY_ID.tgz"
            KEEP_BACKUPS="${KEEP_BACKUPS:-12}"
            AS_APP='sudo -n -u blt_aplicacao --'

            CAN_ROLLBACK="false"

            fail_with_logs() {
              echo "[ERRO] $1"
              echo "=== status gateway-sunteh ==="
              sudo -n systemctl status gateway-sunteh --no-pager || true
              echo "=== logs gateway-sunteh ==="
              sudo -n journalctl -u gateway-sunteh --no-pager -n 80 || true
              exit 1
            }

            rollback() {
              if [ "$CAN_ROLLBACK" = "true" ] && [ -f "$BACKUP_FILE" ]; then
                echo "[ROLLBACK] Restaurando app a partir de $BACKUP_FILE"
                sudo -n systemctl stop gateway-sunteh || true
                sudo -n find "$APP_ROOT" -mindepth 1 \
                  -not -path "$APP_ROOT/log" -not -path "$APP_ROOT/log/*" \
                  -not -path "$BACKUPS_DIR" -not -path "$BACKUPS_DIR/*" -delete
                sh -c "$AS_APP tar -xzf '$BACKUP_FILE' -C '$APP_ROOT'"
                sudo -n systemctl daemon-reload
                sudo -n systemctl start gateway-sunteh || true
              fi
            }

            on_error() {
              echo "[ERRO] Falha na linha $1. Iniciando rollback automático..."
              rollback
              echo "=== status pós-rollback ==="
              sudo -n systemctl status gateway-sunteh --no-pager || true
              echo "=== logs pós-rollback ==="
              sudo -n journalctl -u gateway-sunteh --no-pager -n 100 || true
              exit 1
            }

            trap 'on_error $LINENO' ERR

            echo "=== Preflight de dependências e permissões ==="
            command -v dotnet >/dev/null
            command -v curl >/dev/null
            sudo -n /usr/bin/systemctl --version >/dev/null
            sudo -n /usr/bin/journalctl --version >/dev/null
            sudo -n /usr/bin/chown --version >/dev/null
            sudo -n /usr/bin/cp --version >/dev/null
            sudo -n /usr/bin/find /tmp -maxdepth 0 >/dev/null
            sudo -n /usr/bin/rm -f /tmp/gateway-sudo-check-nonexistent
            sh -c "$AS_APP /usr/bin/mkdir --version >/dev/null"
            sh -c "$AS_APP /usr/bin/tar --version >/dev/null"
            sh -c "$AS_APP /usr/bin/find /tmp -maxdepth 0 >/dev/null"
            sh -c "$AS_APP /usr/bin/rm -f /tmp/gateway-app-sudo-check-nonexistent"

            if [ ! -d "$RUN_TMP" ]; then
              fail_with_logs "Diretório temporário de deploy não encontrado: $RUN_TMP"
            fi

            if [ ! -d "$APP_ROOT" ]; then
              fail_with_logs "Diretório da aplicação não encontrado: $APP_ROOT"
            fi

            # Protege contra deploy que derruba o Hub por config ausente
            if [ ! -f /etc/default/gateway-sunteh ]; then
              fail_with_logs "Arquivo /etc/default/gateway-sunteh não encontrado"
            fi
            grep -q '^Gateway__Hub__Enabled=true$' /etc/default/gateway-sunteh
            grep -q '^Gateway__Hub__Url=http://127.0.0.1:9055$' /etc/default/gateway-sunteh
            grep -q '^Gateway__Hub__JwtIssuer=blt-php$' /etc/default/gateway-sunteh
            grep -q '^Gateway__Hub__JwtAudience=gateway-pos$' /etc/default/gateway-sunteh
            grep -q '^Gateway__Hub__JwtSecret=.\+$' /etc/default/gateway-sunteh

            echo "=== Preparando backup e estado persistente ==="
            sudo -n chown -R blt_aplicacao:blt_aplicacao "$APP_ROOT"
            sh -c "$AS_APP mkdir -p '$BACKUPS_DIR' '$APP_ROOT/log/cache' '$APP_ROOT/log/arquivados'"

            echo "=== Gerando backup antes da atualização ==="
            sh -c "$AS_APP tar -C '$APP_ROOT' --exclude='backups' -czf '$BACKUP_FILE' ."
            CAN_ROLLBACK="true"

            echo "=== Parando serviço e aplicando nova versão ==="
            sudo -n systemctl stop gateway-sunteh || true
            sudo -n find "$APP_ROOT" -mindepth 1 \
              -not -path "$APP_ROOT/log" -not -path "$APP_ROOT/log/*" \
              -not -path "$BACKUPS_DIR" -not -path "$BACKUPS_DIR/*" -delete
            sudo -n cp -a "$RUN_TMP"/. "$APP_ROOT"/
            sudo -n chown -R blt_aplicacao:blt_aplicacao "$APP_ROOT"
            sh -c "$AS_APP find '$APP_ROOT' -type d -exec chmod 755 {} \\;"
            sh -c "$AS_APP find '$APP_ROOT' -type f -exec chmod 644 {} \\;"

            echo "=== Reiniciando serviço ==="
            sudo -n systemctl daemon-reload
            sudo -n systemctl start gateway-sunteh

            echo "=== Validação obrigatória pós-deploy ==="
            # Healthcheck de métricas/healthz (porta 9054)
            for i in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:9054/healthz" >/dev/null; then
                break
              fi
              sleep 1
              if [ "$i" -eq 15 ]; then
                fail_with_logs "Healthcheck 9054/healthz falhou"
              fi
            done

            # Hub deve responder 401 no negotiate quando ativo (porta 9055)
            HUB_CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://127.0.0.1:9055/hub/posicoes/negotiate?negotiateVersion=1' || true)"
            if [ "$HUB_CODE" != "401" ]; then
              fail_with_logs "Validação do Hub falhou (esperado 401, recebido $HUB_CODE)"
            fi

            echo "=== Retenção de backups ==="
            BACKUP_INDEX=0
            for BKP in $(sh -c "$AS_APP ls -1t '$BACKUPS_DIR'/deploy-*.tgz 2>/dev/null" || true); do
              BACKUP_INDEX=$((BACKUP_INDEX + 1))
              if [ "$BACKUP_INDEX" -le "$KEEP_BACKUPS" ]; then
                continue
              fi
              echo "Removendo backup antigo: $BKP"
              sh -c "$AS_APP rm -f '$BKP'"
            done

            echo "=== Limpeza do pacote temporário ==="
            sudo -n rm -rf "$RUN_TMP"

            echo "=== Últimos logs do serviço ==="
            sudo -n journalctl -u gateway-sunteh --no-pager -n 40
            echo "=== Deploy endurecido concluído com sucesso ==="